services:
  - type: web
    name: infera-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install --upgrade pip && pip install ."
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "15728640"
      - key: MAX_ROW_COUNT
        value: "50000"
      - key: CORS_ORIGINS
        value: '["*"]'
