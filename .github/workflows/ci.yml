name: Infera CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infera-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and development dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install "pytest>=8.3.0" "pytest-asyncio>=0.24.0" "httpx>=0.27.0" "ruff>=0.6.0"
      - name: Ruff
        run: python -m ruff check backend/app backend/tests
      - name: Pytest
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://infera-backend-tjg3.onrender.com
        run: npm run build
